aid: arine
name: Arine
description: 'Arine is a San Francisco-based healthcare technology company that operates
  an AI-driven medication intelligence and comprehensive medication management platform
  for health plans, government payors and risk-bearing provider organizations. The
  platform ingests pharmacy and medical claims, clinical, cost, quality, behavioral
  and social-determinants-of-health data, then applies machine learning and clinical
  decision logic to surface medication-related gaps in care and generate targeted,
  just-in-time interventions, member education materials and prescriber communications.
  Arine packages this as four solutions — LUMINATE (high-risk member management),
  RESONATE (prescriber analytics), ELEVATE (Star Ratings and quality improvement)
  and ELEVATE MTM (medication therapy management) — delivered as a SaaS portal running
  in AWS. The Arine Platform holds HITRUST Risk-based 2-year (r2) certification. Arine
  ships no public developer program: its API gateway at api.arine.io is closed to
  anonymous callers and its product documentation portal at docs.arine.io sits behind
  customer authentication, so no machine-readable API contract is publicly available.'
